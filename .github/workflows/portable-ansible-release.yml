name: Release portable Ansible

on:
  push:
    tags:
    - '*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
    - name: Check out source
      uses: actions/checkout@v4

    - name: Build release archive
      id: build
      working-directory: .
      shell: bash
      run: |
        set -euo pipefail
        source metadata
        if [[ "$GITHUB_REF_NAME" != "$VERSION" ]]; then
          echo "Release tag $GITHUB_REF_NAME does not match metadata version $VERSION" >&2
          exit 1
        fi

        cleanup() {
          ./manage.sh builder stop || true
        }
        trap cleanup EXIT

        ./manage.sh builder start
        ./manage.sh builder prepare
        ./manage.sh builder run

        asset="portable-ansible-${VERSION}-py3.tar.gz"
        echo "asset=$PWD/builds/$asset" >> "$GITHUB_OUTPUT"

    - name: Test local and remote execution
      shell: bash
      run: |
        set -euo pipefail
        cleanup() {
          ./manage.sh client stop || true
          ./manage.sh server stop || true
        }
        trap cleanup EXIT

        ./manage.sh server start
        ./manage.sh client start
        ./manage.sh client local_tests
        ./manage.sh client remote_tests

    - name: Publish GitHub release
      uses: softprops/action-gh-release@v2
      with:
        generate_release_notes: true
        files: ${{ steps.build.outputs.asset }}
        fail_on_unmatched_files: true
